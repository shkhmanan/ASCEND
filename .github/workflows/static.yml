# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate PNG application icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for size in 180 192 512; do
            rsvg-convert -w "$size" -h "$size" icon.svg -o "ascend-icon-$size.png"
            test -s "ascend-icon-$size.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for w,h in [(1179,2556),(1206,2622),(1290,2796),(1320,2868),(1125,2436),(1080,2340)]:
              svg=f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}"><rect width="100%" height="100%" fill="#08050d"/><g transform="translate({w/2-120} {h/2-150}) scale(2)"><path d="M60 12 105 60 60 108 15 60Z" fill="none" stroke="#7047a3"/><path d="M28 87 60 24 92 87 60 69Z" fill="#bc8cff" stroke="#ead8ff"/><path d="M60 43 73 71 60 64 47 71Z" fill="#10091b"/></g><text x="{w/2}" y="{h/2+150}" text-anchor="middle" fill="#e5caff" font-family="serif" font-size="48" letter-spacing="12">ASCEND</text></svg>'
              subprocess.run(['rsvg-convert','-o',f'ascend-start-{w}x{h}.png'],input=svg.encode(),check=True)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
